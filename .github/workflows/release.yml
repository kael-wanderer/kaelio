name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            label: macOS-universal
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # tauri.release.conf.json turns on createUpdaterArtifacts, which produces the
      # signed updater bundles (.app.tar.gz, .AppImage, -setup.exe plus .sig) that
      # latest.json points at. It is off in tauri.conf.json so local builds do not
      # need the signing key.
      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bundles
          merge-multiple: true

      - name: List all files
        run: find bundles -type f | sort

      - name: Collect release files and generate latest.json
        run: |
          mkdir -p release-files
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          BASE="https://github.com/${REPO}/releases/download/v${VERSION}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Copy installers
          find bundles -name "*.dmg" -exec cp {} release-files/ \;
          find bundles -name "*.deb" -exec cp {} release-files/ \;
          find bundles -name "*.rpm" -exec cp {} release-files/ \;
          find bundles -name "*.AppImage" ! -name "*.sig" -exec cp {} release-files/ \;
          find bundles -name "*-setup.exe" -exec cp {} release-files/ \;
          find bundles -name "*.msi" ! -name "*.sig" ! -name "*.zip*" -exec cp {} release-files/ \;

          # Copy updater bundles + sigs
          find bundles -name "*.app.tar.gz" -exec cp {} release-files/ \;
          find bundles -name "*.app.tar.gz.sig" -exec cp {} release-files/ \;
          find bundles -name "*.AppImage.sig" -exec cp {} release-files/ \;
          find bundles -name "*-setup.exe.sig" -exec cp {} release-files/ \;

          echo "=== Release files ==="
          ls -la release-files/

          # Read signatures
          cd release-files
          MAC_SIG=$(cat *.app.tar.gz.sig 2>/dev/null || echo "")
          LINUX_SIG=$(cat *.AppImage.sig 2>/dev/null || echo "")
          WIN_SIG=$(cat *-setup.exe.sig 2>/dev/null || echo "")

          MAC_FILE=$(ls *.app.tar.gz 2>/dev/null | grep -v '.sig' | head -1 || echo "")
          LINUX_FILE=$(ls *.AppImage 2>/dev/null | grep -v '.sig' | head -1 || echo "")
          WIN_FILE=$(ls *-setup.exe 2>/dev/null | grep -v '.sig' | head -1 || echo "")

          echo "MAC_SIG=${MAC_SIG}"
          echo "MAC_FILE=${MAC_FILE}"
          echo "LINUX_SIG=${LINUX_SIG}"
          echo "LINUX_FILE=${LINUX_FILE}"
          echo "WIN_SIG=${WIN_SIG}"
          echo "WIN_FILE=${WIN_FILE}"

          # An updater manifest with a missing signature or file makes every
          # installed copy fail to update, silently. Stop the release instead.
          for pair in "macOS:${MAC_SIG}:${MAC_FILE}" "Linux:${LINUX_SIG}:${LINUX_FILE}" "Windows:${WIN_SIG}:${WIN_FILE}"; do
            name="${pair%%:*}"; rest="${pair#*:}"; sig="${rest%%:*}"; file="${rest#*:}"
            if [ -z "$sig" ] || [ -z "$file" ]; then
              echo "::error::Missing updater bundle or signature for ${name}"
              exit 1
            fi
          done

          cat > latest.json << ENDJSON
          {
            "version": "${VERSION}",
            "notes": "Kaelio v${VERSION}",
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "${BASE}/${MAC_FILE}"
              },
              "darwin-x86_64": {
                "signature": "${MAC_SIG}",
                "url": "${BASE}/${MAC_FILE}"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${BASE}/${LINUX_FILE}"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${BASE}/${WIN_FILE}"
              }
            }
          }
          ENDJSON

          echo "=== latest.json ==="
          cat latest.json

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract release notes for this version from CHANGELOG.md
          NOTES=$(awk "/^## ${VERSION}/{found=1; next} /^## [0-9]/{if(found) exit} found{print}" CHANGELOG.md 2>/dev/null | sed '/^$/N;/^\n$/d')
          if [ -z "$NOTES" ]; then
            NOTES="Download the installer for your platform below."
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "Kaelio v${VERSION}" \
            --notes "$NOTES" \
            release-files/*
